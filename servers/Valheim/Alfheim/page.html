<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Alfheim</title>
<style>
:root{color-scheme:dark;--panel:rgba(7,10,15,.78);--line:rgba(255,255,255,.14);--muted:#c6cbd4}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font-family:"Segoe UI",Arial,sans-serif;background:#080b10;color:white;overflow:hidden}
.hero{height:100%;min-height:620px;position:relative;background:
 linear-gradient(90deg,rgba(0,0,0,.88) 0%,rgba(0,0,0,.52) 43%,rgba(0,0,0,.12) 72%),
 linear-gradient(0deg,rgba(5,7,10,.92),transparent 52%),
 url("assets/background.png") center/cover no-repeat}
.content{position:absolute;left:6%;bottom:8%;width:min(650px,86%);padding:34px;border:1px solid var(--line);
 background:var(--panel);backdrop-filter:blur(12px);border-radius:22px;box-shadow:0 22px 70px #0008}
.eyebrow{letter-spacing:.26em;text-transform:uppercase;font-size:12px;color:#b7c1ce}
h1{font-family:Georgia,serif;font-size:72px;line-height:.9;margin:10px 0 13px;letter-spacing:.04em}
.subtitle{font-size:18px;color:#e1e4e9;margin:0 0 24px}
.statusbar{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:24px}
.pill{padding:9px 13px;border-radius:999px;background:#ffffff12;border:1px solid var(--line);font-size:14px}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:#999;margin-right:7px}
.dot.online{background:#59d98e;box-shadow:0 0 12px #59d98e99}.dot.offline{background:#e76a6a}
.actions{display:flex;gap:12px;flex-wrap:wrap}
.btn{display:inline-block;text-decoration:none;color:#111;background:#fff;padding:14px 22px;border-radius:10px;font-weight:800}
.btn.secondary{color:#fff;background:#ffffff12;border:1px solid var(--line)}
.footer{margin-top:22px;color:var(--muted);font-size:13px}.footer a{color:white}
</style>
</head>
<body>
<main class="hero">
<section class="content">
<div class="eyebrow">Potter Service Game Hub</div>
<h1>ALFHEIM</h1>
<p class="subtitle">A Valheim World Managed by Bow</p>
<div class="statusbar">
 <div class="pill"><span id="statusDot" class="dot"></span><span id="statusText">Checking server…</span></div>
 <div class="pill">Players: <strong id="players">-- / --</strong></div>
</div>
<div class="actions">
 <a class="btn" href="pslauncher://join-server">ENTER THE WORLD</a>
 <a class="btn secondary" href="pslauncher://refresh-status">REFRESH STATUS</a>
</div>
<div class="footer">Sponsored by <a href="https://potterservice.com">Potter Service</a> • Server managed by Bow</div>
</section>
</main>
<script>
window.PotterLauncher = {
 setServerStatus: function(data){
   const online=!!data.online;
   document.getElementById("statusText").textContent=online ? "ONLINE" : "OFFLINE";
   const dot=document.getElementById("statusDot");
   dot.className="dot "+(online?"online":"offline");
   document.getElementById("players").textContent=
     (data.players ?? "--")+" / "+(data.maxPlayers ?? "--");
 }
};
</script>
</body>
</html>
